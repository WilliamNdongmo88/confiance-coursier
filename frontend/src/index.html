<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>ConfianceCoursier</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="ConfianceCoursier : faites livrer, acheter ou retirer partout au Cameroun, paiement bloqué jusqu’à la validation des preuves." />
    <meta name="theme-color" content="#123b32" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&amp;display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- Applique le thème persistant avant le boot Angular (évite le flash de thème) -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme') || 'light';
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
  </head>
  <script>
    var global = window;
  </script>
  <body>
    <app-root></app-root>
    <noscript>Activez JavaScript pour utiliser ConfianceCoursier.</noscript>
  </body>
</html>
