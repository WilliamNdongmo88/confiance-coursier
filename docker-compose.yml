version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: confiance_postgres
    environment:
      POSTGRES_DB: confiancecoursier
      POSTGRES_USER: confiance_coursier_user
      POSTGRES_PASSWORD: confiance_coursier_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: confiance_redis
    ports:
      - "6379:6379"

  minio:
    image: pgsty/silo:latest   # <-- Changement ici
    container_name: confiance_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: confiance_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@confiancecoursier.cm
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  pgdata: