version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: confiance_postgres
    environment:
      POSTGRES_DB: confiancecoursier
      POSTGRES_USER: confiance_coursier_user
      POSTGRES_PASSWORD: confiance_coursier_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: confiance_redis
    ports:
      - "6379:6379"

  minio:
    image: pgsty/silo:latest
    container_name: confiance_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"

  adminer:
    image: adminer:latest
    container_name: confiance_adminer
    restart: always
    ports:
      - "5050:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres

volumes:
  pgdata: