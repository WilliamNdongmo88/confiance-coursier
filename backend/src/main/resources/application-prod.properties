# ═════════════════════════════════════════════════════════════
# Profil prod (SPRING_PROFILES_ACTIVE=prod)
# Aucune valeur par défaut pour l'infrastructure : une variable manquante
# arrête le démarrage avec la liste complète (RequiredConfigurationCheck).
# ═════════════════════════════════════════════════════════════

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.data.redis.host=${REDIS_HOST}
minio.url=${MINIO_URL}
app.frontend.url=${FRONTEND_URL}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Jamais de code OTP ni de SQL dans les logs
app.otp.dev-log=false
spring.jpa.show-sql=false
logging.level.org.flywaydb=INFO
