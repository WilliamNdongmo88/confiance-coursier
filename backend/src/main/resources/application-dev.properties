# ═════════════════════════════════════════════════════════════
# Profil dev (actif par défaut en local — spring.profiles.default=dev)
# Confort de développement uniquement : JAMAIS en production.
# ═════════════════════════════════════════════════════════════

# Requêtes SQL visibles en console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Détail des migrations Flyway
logging.level.org.flywaydb=DEBUG

# Code OTP journalisé en console (permet de tester sans boîte mail)
app.otp.dev-log=true

# TICK-071 : chat et API accessibles depuis un téléphone du réseau local (ng serve --host 0.0.0.0)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,http://192.168.*.*:4200,http://10.*.*.*:4200}
