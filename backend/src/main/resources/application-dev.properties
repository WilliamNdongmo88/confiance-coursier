# Requêtes SQL visibles en console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Détail des migrations Flyway
logging.level.org.flywaydb=DEBUG

# Code OTP journalisé en console (permet de tester sans boîte mail)
app.otp.dev-log=true
