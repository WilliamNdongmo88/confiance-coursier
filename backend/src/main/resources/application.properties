# ═════════════════════════════════════════════════════════════
# Configuration commune — AUCUN SECRET ICI (TICK-068)
# Les secrets viennent des variables d'environnement ou de backend/.env
# (chargé au démarrage par BackendApplication). Modèle : backend/.env.example
#
# Profils :
#   dev  (par défaut en local) → application-dev.properties : logs SQL, OTP en console
#   prod (SPRING_PROFILES_ACTIVE=prod) → application-prod.properties : tout est obligatoire
# ═════════════════════════════════════════════════════════════
spring.application.name=confiance-coursier-backend
spring.profiles.default=dev

# backend/.env lu aussi par les tests Spring (qui ne passent pas par BackendApplication.main).
# Facultatif : absent en production, où les variables viennent de l'environnement.
# Les variables d'environnement réelles restent prioritaires sur ce fichier.
spring.config.import=optional:file:./.env[.properties],optional:file:./backend/.env[.properties]
server.port=${PORT:8080}

# PostgreSQL — mot de passe obligatoire (aucune valeur par défaut)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/confiancecoursier}
spring.datasource.username=${DB_USERNAME:confiance_coursier_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JWT — secret obligatoire
jwt.secret=${JWT_SECRET_KEY}
jwt.expiration=900000
jwt.refresh-expiration=604800000

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# ─────────────────────────────────────────────────────────────
# Email — API REST Brevo
# ─────────────────────────────────────────────────────────────
brevo.api.url=https://api.brevo.com/v3/smtp/email
brevo.api.key=${BREVO_API_KEY}

# OTP par email
# app.otp.email-enabled : false désactive l'envoi (tests)
# app.otp.dev-log       : journalise le code OTP en console — false par défaut, true seulement en profil dev
app.otp.sender-email=${BREVO_SENDER_EMAIL}
app.otp.app-name=${BREVO_APP_NAME:ConfianceCoursier}
app.otp.email-enabled=true
app.otp.dev-log=false

# URL du frontend (liens des emails) et origines CORS autorisées (séparées par des virgules)
app.frontend.url=${FRONTEND_URL:http://localhost:4200}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Derrière un reverse proxy de confiance uniquement : lit la vraie IP dans X-Forwarded-For (TICK-066)
app.security.trust-forwarded-for=${TRUST_FORWARDED_FOR:false}

# ─────────────────────────────────────────────────────────────
# Multipart — Upload de fichiers (KYC, preuves)
# Sans ces limites, Spring Boot utilise 1MB/10MB par défaut → Tomcat coupe
# la connexion TCP sans réponse → "Failed to fetch" côté navigateur sans log.
# TICK-064 : 60 Mo pour une vidéo de preuve. Les limites par type sont vérifiées dans le code
# (preuves : vidéo 60 Mo, photo/reçu 10 Mo — KYC : 10 Mo par document).
# ─────────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=60MB
spring.servlet.multipart.max-request-size=70MB

# ─────────────────────────────────────────────────────────────
# MinIO — Stockage objet (KYC, preuves de livraison) — identifiants obligatoires
# ─────────────────────────────────────────────────────────────
minio.url=${MINIO_URL:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY}
minio.secret-key=${MINIO_SECRET_KEY}
minio.bucket-kyc=kyc-documents
minio.bucket-proofs=delivery-proofs

# ─────────────────────────────────────────────────────────────
# Admin seed — compte administrateur initial
# Créé au démarrage si aucun user avec role=ADMIN n'existe (ADMIN_EMAIL / ADMIN_PASSWORD).
# ─────────────────────────────────────────────────────────────
admin.email=${ADMIN_EMAIL:}
admin.password=${ADMIN_PASSWORD:}

# Paiement : SIMULATION tant qu'aucun prestataire réel (Mobile Money, carte) n'est intégré — affiché au client
app.payment.mode=${PAYMENT_MODE:SIMULATION}
