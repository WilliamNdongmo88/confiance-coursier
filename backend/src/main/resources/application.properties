# Application Name
spring.application.name=confiance-coursier-backend

# Server Port
server.port=8080

# PostgreSQL Database Configuration (Docker)
spring.datasource.url=jdbc:postgresql://localhost:5432/confiancecoursier
spring.datasource.username=confiance_coursier_user
spring.datasource.password=confiance_coursier_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JWT Configuration
jwt.secret=${JWT_SECRET_KEY}
jwt.expiration=900000
jwt.refresh-expiration=604800000

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379

# DEBUG
logging.level.org.flywaydb=DEBUG

# ─────────────────────────────────────────────────────────────
# Email — API REST Brevo (identifiants chargés depuis .env)
# Utilise l'API REST Brevo au lieu de SMTP pour éviter les problèmes
# d'authentification (le SMTP Brevo exige l'email de connexion du compte,
# pas nécessairement l'email expéditeur).
# ─────────────────────────────────────────────────────────────
brevo.api.url=https://api.brevo.com/v3/smtp/email
brevo.api.key=${BREVO_API_KEY}

# OTP par email
# app.otp.sender-email : adresse expéditeur (vérifiée dans Brevo)
# app.otp.email-enabled : false désactive l'envoi (utile en test/dev sans clé)
# app.otp.dev-log      : true journalise le code OTP en console (DEV uniquement — passer à false en production)
app.otp.sender-email=${BREVO_SENDER_EMAIL}
app.otp.app-name=${BREVO_APP_NAME:ConfianceCoursier}
app.otp.email-enabled=true
app.otp.dev-log=true

# URL du frontend (utilisée dans les liens des emails de reset)
app.frontend.url=http://localhost:4200

# ─────────────────────────────────────────────────────────────
# Multipart — Upload de fichiers (KYC, preuves)
# max-file-size    : taille max d'un seul fichier
# max-request-size : taille max de toute la requête (3 fichiers KYC + overhead)
# Sans ces limites, Spring Boot utilise 1MB/10MB par défaut → Tomcat coupe
# la connexion TCP sans réponse → "Failed to fetch" côté navigateur sans log.
# ─────────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=35MB

# ─────────────────────────────────────────────────────────────
# MinIO — Stockage objet (KYC, preuves de livraison)
# ─────────────────────────────────────────────────────────────
minio.url=http://localhost:9000
minio.access-key=minioadmin
minio.secret-key=minioadmin
minio.bucket-kyc=kyc-documents
minio.bucket-proofs=delivery-proofs
